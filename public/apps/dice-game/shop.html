<!doctype html>

<html>
    <head>
        <title>Dice Game Profile</title>

        <link rel="stylesheet" href="/css/kotomi.css" />
        <link rel="stylesheet" href="/apps/dice-game/style.css" />
    </head>

    <body>
        <div id="app-header"></div>

        <main class="kotomi-container">
            <div class="profile-header">
                <h1>Shop</h1>
                <a href="/apps/dice-game/" class="kotomi-button-secondary"> ← Back to Game </a>
            </div>

            <div id="shop-money" class="card"></div>
            <section class="shop-section">
                <h2>Items</h2>
                <div id="shop-items" class="item-grid"></div>
            </section>

            <section class="shop-section">
                <h2>Upgrades</h2>
                <div id="shop-upgrades" class="item-grid"></div>
            </section>
        </main>

        <script type="module" src="shop.js"></script>
    </body>
</html>
