<!doctype html>

<html>
    <head>
        <title>Dice Game Profile</title>

        <link rel="stylesheet" href="/css/kotomi.css" />
        <link rel="stylesheet" href="/apps/dice-game/style.css" />
    </head>

    <body>
        <div id="app-header"></div>

        <main class="kotomi-container">
            <div class="profile-header">
                <div>
                    <h1>Player Profile</h1>
                    <p class="profile-subtitle">Your dice journey</p>
                </div>

                <a href="/apps/dice-game/" class="kotomi-button-secondary"> ← Back to Game </a>
            </div>

            <section class="kotomi-card profile-banner">
                <div id="player-info"></div>
            </section>

            <section class="profile-stats" id="stats"></section>

            <div class="profile-columns">
                <section class="kotomi-card">
                    <h2>Current Setup</h2>
                    <div id="dice-setup"></div>
                </section>

                <section class="kotomi-card">
                    <h2>Top Rolls</h2>
                    <div id="top-rolls"></div>
                </section>
            </div>

            <section class="kotomi-card inventory-card">
                <h2>Inventory</h2>
                <div id="items"></div>
            </section>

            <section class="kotomi-card achievements-card">
                <h2>Achievements</h2>
                <p id="achievement-count"></p>
                <div id="achievements"></div>
            </section>
        </main>

        <script type="module" src="profile.js"></script>
    </body>
</html>
