<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Kotomi - Dice Game</title>

        <link rel="stylesheet" href="/css/kotomi.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div id="app-header"></div>

        <div id="achievement-notifications"></div>
        <div id="item-notifications"></div>

        <main class="kotomi-container">
            <div class="link-container">
                <a href="/apps/dice-game/profile.html" class="kotomi-link"> View Profile </a>
                <a href="/apps/dice-game/shop.html" class="kotomi-link"> Shop </a>
                <a href="/apps/dice-game/statistics.html" class="kotomi-link"> Statistics </a>
            </div>
            <div class="kotomi-card">
                <h2>🎲 Dice Game</h2>
                <p>Roll weighted dice, earn score, unlock upgrades, and climb the leaderboards.</p>
                <button id="rollButton" class="kotomi-button">Throw Dice</button>
                <div id="result"></div>

                <section class="roll-history">
                    <h2>Recent Rolls</h2>
                    <div id="history"></div>
                </section>
            </div>
        </main>

        <script type="module" src="./app.js"></script>
    </body>
</html>
