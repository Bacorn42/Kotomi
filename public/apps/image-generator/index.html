<!doctype html>

<html>
    <head>
        <title>Kotomi - Image Generator</title>

        <link rel="stylesheet" href="/css/theme.css" />
        <link rel="stylesheet" href="/css/base.css" />
        <link rel="stylesheet" href="/css/layout.css" />
        <link rel="stylesheet" href="/css/components.css" />

        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <header class="kotomi-header">
            <h1>Kotomi</h1>
            <span> Image Generator </span>
            <a href="/"> ← Back to Kotomi </a>
        </header>

        <main class="kotomi-container">
            <section class="kotomi-card generator">
                <h2>Create an Image</h2>
                <textarea
                    id="prompt"
                    class="kotomi-input"
                    placeholder="Describe what you want to create..."
                ></textarea>
                <button id="generate" class="kotomi-button">✨ Generate Image</button>
                <div id="status" class="kotomi-status">Ready</div>
                <progress id="progress" class="kotomi-progress" value="0" max="100"></progress>
                <img id="result" style="display: none" />
            </section>
        </main>

        <script src="/socket.io/socket.io.js"></script>
        <script src="app.js"></script>
    </body>
</html>
