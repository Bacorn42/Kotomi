<!doctype html>

<html>
    <head>
        <title>Kotomi - Image Generator</title>

        <link rel="stylesheet" href="/css/kotomi.css" />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div id="app-header"></div>

        <main class="kotomi-container">
            <section class="kotomi-card generator">
                <h2>Create an Image</h2>

                <div class="kotomi-field">
                    <label class="kotomi-checkbox">
                        <input type="checkbox" id="enhancePrompt" checked />
                        <span>Enhance prompt with AI</span>
                    </label>
                </div>

                <div class="kotomi-field">
                    <label for="modelSelect" class="kotomi-label">Language Model</label>
                    <select id="modelSelect" class="kotomi-control"></select>
                </div>

                <div class="kotomi-field">
                    <label for="resolutionSelect" class="kotomi-label"> Resolution </label>
                    <select id="resolutionSelect" class="kotomi-control">
                        <option value="256">256 × 256</option>
                        <option value="512" selected>512 × 512</option>
                        <option value="768">768 × 768</option>
                        <option value="1024">1024 × 1024</option>
                    </select>
                </div>

                <div class="kotomi-field">
                    <label for="stepsInput" class="kotomi-label"> Steps </label>
                    <input
                        id="stepsInput"
                        class="kotomi-control"
                        type="number"
                        min="1"
                        max="50"
                        value="8"
                    />
                </div>

                <div class="kotomi-field">
                    <label for="prompt" class="kotomi-label">Prompt</label>
                    <textarea
                        id="prompt"
                        class="kotomi-control"
                        placeholder="Describe what you want to create..."
                    ></textarea>
                </div>

                <button id="generate" class="kotomi-button">✨ Generate Image</button>
                <button id="cancel" class="kotomi-button hide">❌ Cancel Generation</button>
                <div id="status" class="kotomi-status">Ready</div>
                <progress id="progress" class="kotomi-progress" value="0" max="100"></progress>
                <div class="kotomi-field">
                    <label class="kotomi-label" for="promptOutput">
                        Prompt Sent to Image Model
                    </label>
                    <div id="promptOutput" class="prompt"></div>
                </div>
                <img id="result" style="display: none" />
            </section>

            <section id="history" class="kotomi-card">
                <h2>Generated Images</h2>
                <p class="kotomi-status">Your previous generations</p>
                <div id="historyGrid"></div>
            </section>
        </main>

        <div id="imageModal" class="kotomi-modal hide">
            <div class="kotomi-modal-content">
                <button id="closeModal" class="modal-close">✕</button>
                <img id="modalImage" class="kotomi-modal-image" />
                <h2 id="modalPrompt" class="kotomi-modal-title"></h2>
                <div id="modalDetails" class="kotomi-modal-details"></div>
                <div class="kotomi-modal-actions">
                    <button id="downloadImage" class="kotomi-button">Download</button>
                    <button id="regenerateImage" class="kotomi-button">🔄 Regenerate</button>
                    <button id="deleteImage" class="kotomi-button">Delete</button>
                </div>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script type="module" src="app.js"></script>
    </body>
</html>
