<!doctype html>

<html>
    <head>
        <title>Kotomi - Music</title>

        <link rel="stylesheet" href="/css/kotomi.css" />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div id="app-header"></div>

        <main class="kotomi-container music-app">
            <section class="music-sidebar-section">
                <div class="music-sidebar-heading">
                    <h2>Playlists</h2>
                </div>

                <aside class="music-sidebar kotomi-card">
                    <form id="playlistForm" class="music-tag-form">
                        <input
                            type="text"
                            id="playlistNameInput"
                            class="kotomi-control"
                            placeholder="New playlist..."
                            maxlength="100"
                        />

                        <button type="submit" class="kotomi-button">+</button>
                    </form>

                    <div id="playlistStatus" class="music-tag-status hide"></div>

                    <div id="playlistList" class="music-playlist-list"></div>
                </aside>

                <div class="music-sidebar-heading music-sidebar-subheading">
                    <h2>Tags</h2>
                </div>

                <aside class="music-sidebar kotomi-card">
                    <form id="tagForm" class="music-tag-form">
                        <input
                            type="text"
                            id="tagNameInput"
                            class="kotomi-control"
                            placeholder="New tag..."
                            maxlength="50"
                        />

                        <button type="submit" class="kotomi-button">+</button>
                    </form>

                    <div id="tagStatus" class="music-tag-status hide"></div>

                    <div id="tagList" class="music-tag-list"></div>
                </aside>
            </section>

            <section class="music-library">
                <div class="music-library-header">
                    <h2 id="libraryHeading">Music Library</h2>

                    <button id="uploadButton" class="kotomi-button">+ Add Music</button>

                    <input type="file" id="fileInput" accept=".mp3,audio/mpeg" multiple hidden />
                </div>

                <div class="music-library-controls">
                    <input
                        type="search"
                        id="searchInput"
                        class="kotomi-control"
                        placeholder="Search tracks, artists, or albums..."
                    />

                    <select id="sortSelect" class="kotomi-control">
                        <option value="added">Recently added</option>
                        <option value="title">Title</option>
                        <option value="artist">Artist</option>
                        <option value="album">Album</option>
                    </select>

                    <button
                        id="sortDirectionButton"
                        class="kotomi-button-secondary"
                        title="Toggle sort direction"
                        aria-label="Toggle sort direction"
                    >
                        ↓
                    </button>
                </div>

                <div id="bulkToolbar" class="music-bulk-toolbar hide">
                    <span id="selectedTrackCount">0 selected</span>

                    <button id="selectVisibleButton" class="kotomi-button-secondary">
                        Select visible
                    </button>

                    <select id="bulkTagSelect" class="kotomi-control">
                        <option value="">Choose a tag...</option>
                    </select>

                    <button id="applyBulkTagButton" class="kotomi-button-secondary">Add tag</button>

                    <button id="removeBulkTagButton" class="kotomi-button-secondary">
                        Remove tag
                    </button>

                    <button id="clearSelectionButton" class="kotomi-button-secondary">
                        Clear selection
                    </button>
                </div>

                <div id="dropZone" class="music-drop-zone">
                    <div class="music-drop-icon">♫</div>
                    <h3>Drop your music here</h3>
                    <p>Or use the Add Music button to select MP3 files.</p>
                    <p class="music-drop-hint">
                        MP3 files · Up to 100 MB each · 20 files per upload
                    </p>
                </div>

                <div id="uploadProgress" class="music-upload-progress hide">
                    <div class="music-upload-progress-header">
                        <span id="uploadStatus">Uploading...</span>
                        <span id="uploadPercentage">0%</span>
                    </div>

                    <progress
                        id="uploadProgressBar"
                        class="kotomi-progress"
                        value="0"
                        max="100"
                    ></progress>
                </div>

                <div id="uploadResults" class="music-upload-results hide"></div>

                <div id="trackList" class="music-track-list"></div>

                <div id="libraryEmpty" class="music-library-empty kotomi-card">
                    <div class="music-empty-icon">♫</div>
                    <h2>Your library is empty</h2>
                    <p>Your music collection will appear here once you add some tracks.</p>
                </div>
            </section>
        </main>

        <script type="module" src="app.js"></script>
    </body>
</html>
